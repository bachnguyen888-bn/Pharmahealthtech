<body>
<script type="module">
// Pengu's health station: a floating lilac planet island with one cute module per part of the
// game, in an isometric view. Original geometry; the station labels are placed in HTML from the
// anchor positions this page reports in window.__anchors.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const P = new URLSearchParams(location.search);
const W = Number(P.get('w') || 1920), H = Number(P.get('h') || 1080);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

// Isometric-style orthographic camera.
const viewH = Number(P.get('view') || 19.5);
const camera = new THREE.OrthographicCamera(-viewH * W / H / 2, viewH * W / H / 2, viewH / 2, -viewH / 2, 0.1, 400);
const az = THREE.MathUtils.degToRad(38), el = THREE.MathUtils.degToRad(31);
camera.position.set(80 * Math.cos(el) * Math.sin(az), 80 * Math.sin(el), 80 * Math.cos(el) * Math.cos(az));
camera.lookAt(0.2, -0.5, 0.6);

// Sky: a camera-facing gradient card far behind the island, with stars.
const skyMat = new THREE.ShaderMaterial({
  depthWrite: false, toneMapped: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `
    varying vec2 vUv;
    vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec3 top = lin(vec3(0.47, 0.45, 1.00));    // #7873FF
      vec3 mid = lin(vec3(0.74, 0.55, 1.00));    // #BD8CFF
      vec3 low = lin(vec3(1.00, 0.70, 0.86));    // #FFB3DB
      float t = clamp(vUv.y * 0.85 + (1.0 - vUv.x) * 0.15, 0.0, 1.0);
      vec3 col = mix(low, mid, smoothstep(0.0, 0.55, t));
      col = mix(col, top, smoothstep(0.5, 1.0, t));
      vec2 cell = vUv * vec2(120.0, 68.0);
      vec2 g = floor(cell), f = fract(cell) - 0.5;
      float on = step(0.93, h(g));
      float r = mix(0.06, 0.16, h(g + 7.0));
      float s = on * smoothstep(r, r * 0.35, length(f)) * smoothstep(0.3, 0.9, vUv.y);
      col += s * 0.85;
      col += (h(gl_FragCoord.xy) - 0.5) / 255.0;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const sky = new THREE.Mesh(new THREE.PlaneGeometry(80, 45), skyMat);
sky.position.copy(camera.position).multiplyScalar(-1.2);
sky.lookAt(camera.position);
scene.add(sky);

// Lights: bright soft daylight with gentle shadows.
scene.add(new THREE.HemisphereLight(0xffffff, 0xb7a6ff, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-14, 26, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 80 });
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
scene.add(sun);

// Materials
const mat = (hex, o = {}) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.55, metalness: 0, ...o });
const M = {
  top: mat(0xc9b6ff), side: mat(0x8b67f2), deep: mat(0x6a47d6), crater: mat(0xb39cf9),
  walk: mat(0xeef0f7, { roughness: 0.45 }), walkEdge: mat(0xc8cde0), white: mat(0xf8f9fd, { roughness: 0.4 }),
  panel: mat(0xd2d6e4), dark: mat(0x2c3464, { roughness: 0.25 }), glass: new THREE.MeshPhysicalMaterial({ color: 0xbfe8ff, roughness: 0.05, transmission: 0.6, thickness: 0.5, transparent: true, opacity: 0.85 }),
  orange: mat(0xff9b45), mint: mat(0x5fe0b2), pink: mat(0xff73b0), yellow: mat(0xffd35c), sky: mat(0x5cc8ff), red: mat(0xff5a6e),
  green: mat(0x3fcf8e), gold: mat(0xffc93c, { metalness: 0.3, roughness: 0.3 }), violet: mat(0x9a6bff), teal: mat(0x40dccb),
  navy: mat(0x34436a, { roughness: 0.35 }), belly: mat(0xffffff, { roughness: 0.35 }), amber: mat(0xffa33a, { roughness: 0.4 }),
  scarf: mat(0x7bd8a6, { roughness: 0.5 }), blush: mat(0xff8fab, { roughness: 0.6 }), eye: mat(0x1f2230, { roughness: 0.2 }),
  water: new THREE.MeshPhysicalMaterial({ color: 0x6fc4ff, roughness: 0.08, transmission: 0.3, transparent: true, opacity: 0.92 }),
};
const glow = (hex, i = 1.6) => new THREE.MeshStandardMaterial({ color: hex, emissive: hex, emissiveIntensity: i, roughness: 0.4 });

const mesh = (geo, m, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1], parent = scene) => {
  const o = new THREE.Mesh(geo, m);
  o.position.set(...p); o.rotation.set(...r); o.scale.set(...s);
  o.castShadow = true; o.receiveShadow = true;
  parent.add(o); return o;
};
const box = (w, h, d, rad = 0.12) => new RoundedBoxGeometry(w, h, d, 4, Math.min(rad, w / 2, h / 2, d / 2) * 0.999);
const cyl = (rt, rb, h, seg = 48) => new THREE.CylinderGeometry(rt, rb, h, seg);
const sph = (r, ws = 48, hs = 32) => new THREE.SphereGeometry(r, ws, hs);
const group = (x, z, ry = 0) => { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g); return g; };

// ---------- Island ----------
mesh(box(25, 1.0, 14.5, 1.6), M.top, [0, -0.5, 0]);
mesh(box(24.4, 1.6, 13.9, 1.6), M.side, [0, -1.55, 0]);
mesh(box(22.6, 1.4, 12.2, 1.6), M.deep, [0, -2.7, 0]);
for (const [x, z, r] of [[-10.2, -4.6, 1.0], [10.6, 5.2, 0.8], [-1.2, 5.6, 0.7], [2.5, -5.9, 0.6], [10.8, -4.4, 0.65], [-4.2, 1.9, 0.55]]) {
  mesh(cyl(r, r * 1.05, 0.06), M.crater, [x, 0.01, z]);
  mesh(new THREE.TorusGeometry(r, 0.12, 12, 48), M.top, [x, 0.04, z], [Math.PI / 2, 0, 0]);
}

// ---------- Walkways from the landing pad to each module ----------
const walk = (x1, z1, x2, z2, wdt = 1.3) => {
  const len = Math.hypot(x2 - x1, z2 - z1), ang = Math.atan2(x2 - x1, z2 - z1);
  const g = new THREE.Group(); g.position.set((x1 + x2) / 2, 0, (z1 + z2) / 2); g.rotation.y = ang; scene.add(g);
  mesh(box(wdt, 0.16, len, 0.06), M.walk, [0, 0.08, 0], [0, 0, 0], [1, 1, 1], g);
  for (let t = -len / 2 + 0.6; t < len / 2 - 0.3; t += 1.1) mesh(box(wdt * 0.98, 0.02, 0.05, 0.01), M.walkEdge, [0, 0.17, t], [0, 0, 0], [1, 1, 1], g);
};
walk(0, 0, -7, -2.2); walk(0, 0, -2.8, -4.4); walk(0, 0, 4.2, -3.4); walk(0, 0, 8.2, 0.4);
walk(0, 0, -7.2, 3.4); walk(0, 0, 1.6, 4.6); walk(0, 0, 6.0, 4.2);

// ---------- Landing pad and Pengu ----------
mesh(cyl(1.9, 2.0, 0.3, 64), M.white, [0, 0.15, 0]);
mesh(cyl(1.2, 1.2, 0.04, 64), M.panel, [0, 0.31, 0]);
for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2; mesh(box(0.42, 0.04, 0.2, 0.03), i % 2 ? M.yellow : M.dark, [Math.cos(a) * 1.58, 0.33, Math.sin(a) * 1.58], [0, -a - Math.PI / 2, 0]); }

const pengu = new THREE.Group(); pengu.position.set(0, 0.33, 0); pengu.rotation.y = az; scene.add(pengu);
{
  const egg = [];
  for (let i = 0; i <= 40; i++) { const t = i / 40; egg.push(new THREE.Vector2(Math.max(0.001, Math.pow(Math.sin(Math.PI * t), 0.82) * (0.98 - 0.16 * t)), t * 2.3)); }
  mesh(new THREE.LatheGeometry(egg, 64), M.navy, [0, 0.22, 0], [0, 0, 0], [1, 1, 0.92], pengu);
  mesh(sph(1), M.belly, [0, 0.95, 0.42], [0, 0, 0], [0.62, 0.68, 0.52], pengu);
  mesh(sph(1), M.belly, [-0.24, 1.72, 0.44], [0, 0, 0], [0.36, 0.34, 0.36], pengu);
  mesh(sph(1), M.belly, [0.24, 1.72, 0.44], [0, 0, 0], [0.36, 0.34, 0.36], pengu);
  mesh(sph(1), M.belly, [0, 1.5, 0.5], [0, 0, 0], [0.46, 0.3, 0.36], pengu);
  for (const s of [-1, 1]) {
    mesh(sph(0.1), M.eye, [s * 0.22, 1.78, 0.78], [0, 0, 0], [1, 1.25, 0.6], pengu);
    mesh(sph(0.035), M.belly, [s * 0.22 + 0.035, 1.82, 0.84], [0, 0, 0], [1, 1, 1], pengu);
    mesh(sph(0.09), M.blush, [s * 0.4, 1.58, 0.72], [0, 0, 0], [1, 0.6, 0.4], pengu);
    mesh(sph(1), M.navy, [s * 0.98, 0.95, 0.02], [0, 0, s * 0.32], [0.17, 0.52, 0.3], pengu);
    mesh(sph(1), M.amber, [s * 0.34, 0.2, 0.4], [0, 0, 0], [0.3, 0.12, 0.42], pengu);
  }
  mesh(new THREE.ConeGeometry(0.13, 0.28, 24), M.amber, [0, 1.55, 0.92], [Math.PI / 2, 0, 0], [1, 1, 0.8], pengu);
  mesh(new THREE.TorusGeometry(0.8, 0.15, 20, 64), M.scarf, [0, 1.32, 0.02], [Math.PI / 2 - 0.1, 0, 0], [1, 0.95, 1], pengu);
  mesh(box(0.26, 0.62, 0.14, 0.06), M.scarf, [0.42, 0.98, 0.78], [0.18, 0, -0.2], [1, 1, 1], pengu);
}

// ---------- Modules ----------
const anchors = {};
const anchor = (name, x, y, z) => { anchors[name] = new THREE.Vector3(x, y, z); };
const pad = (g, w, d) => mesh(box(w, 0.2, d, 0.1), M.walkEdge, [0, 0.1, 0], [0, 0, 0], [1, 1, 1], g);
const windows = (g, n, y, z, w = 0.45) => { for (let i = 0; i < n; i++) mesh(box(w, 0.32, 0.06, 0.06), M.dark, [(i - (n - 1) / 2) * (w + 0.18), y, z], [0, 0, 0], [1, 1, 1], g); };

// Move: the gym module, with a dumbbell on the roof.
{
  const g = group(-7.6, -2.6, 0.2); pad(g, 4.2, 3.4);
  mesh(box(3.6, 2.2, 2.8, 0.4), M.white, [0, 1.3, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(box(3.64, 0.3, 2.84, 0.12), M.orange, [0, 0.55, 0], [0, 0, 0], [1, 1, 1], g);
  windows(g, 3, 1.55, 1.42);
  mesh(box(0.9, 1.3, 0.08, 0.1), M.dark, [1.1, 0.95, 1.42], [0, 0, 0], [1, 1, 1], g);
  mesh(cyl(0.12, 0.12, 2.4, 24), M.panel, [0, 2.75, 0], [0, 0, Math.PI / 2], [1, 1, 1], g);
  for (const s of [-1, 1]) { mesh(cyl(0.42, 0.42, 0.36, 40), M.orange, [s * 1.0, 2.75, 0], [0, 0, Math.PI / 2], [1, 1, 1], g); mesh(cyl(0.3, 0.3, 0.2, 32), M.orange, [s * 1.3, 2.75, 0], [0, 0, Math.PI / 2], [1, 1, 1], g); }
  anchor('move', -7.6, 3.4, -2.6);
}
// Learn: a glass dome with a glowing idea bulb, on a round base.
{
  const g = group(-2.8, -5.0); pad(g, 3.4, 3.4);
  mesh(cyl(1.5, 1.6, 0.9, 64), M.white, [0, 0.65, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(cyl(1.52, 1.52, 0.18, 64), M.sky, [0, 1.0, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(new THREE.SphereGeometry(1.42, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), M.glass, [0, 1.1, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(sph(0.42), glow(0xfff1a6, 1.2), [0, 1.85, 0], [0, 0, 0], [1, 1.1, 1], g);
  mesh(cyl(0.2, 0.24, 0.3, 24), M.panel, [0, 1.38, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(cyl(0.04, 0.04, 1.0, 12), M.panel, [0.9, 2.5, -0.3], [0, 0, 0], [1, 1, 1], g);
  mesh(sph(0.14), glow(0x5fe0b2, 1.5), [0.9, 3.05, -0.3], [0, 0, 0], [1, 1, 1], g);
  anchor('learn', -2.8, 3.3, -5.0);
}
// Play: the arcade, with big FACTS (green) and CAP (red) buttons on its screen.
{
  const g = group(4.4, -3.8, -0.15); pad(g, 4.0, 3.2);
  mesh(box(3.2, 2.6, 2.4, 0.45), M.white, [0, 1.5, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(box(3.24, 0.36, 2.44, 0.16), M.pink, [0, 2.75, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(box(2.3, 1.2, 0.1, 0.12), M.dark, [0, 1.65, 1.21], [0, 0, 0], [1, 1, 1], g);
  mesh(box(0.85, 0.5, 0.12, 0.14), glow(0x3fcf8e, 1.1), [-0.52, 1.65, 1.28], [0, 0, 0], [1, 1, 1], g);
  mesh(box(0.85, 0.5, 0.12, 0.14), glow(0xff5a6e, 1.1), [0.52, 1.65, 1.28], [0, 0, 0], [1, 1, 1], g);
  mesh(box(2.0, 0.2, 0.5, 0.08), M.panel, [0, 0.8, 1.35], [0, 0, 0], [1, 1, 1], g);
  for (const [x, m] of [[-0.5, M.yellow], [0, M.sky], [0.5, M.mint]]) mesh(sph(0.12), m, [x, 0.95, 1.45], [0, 0, 0], [1, 0.6, 1], g);
  anchor('play', 4.4, 3.6, -3.8);
}
// League: a podium with a gold trophy.
{
  const g = group(8.6, 0.6, -0.5); pad(g, 4.2, 2.6);
  mesh(box(1.2, 1.0, 1.4, 0.15), M.sky, [-1.25, 0.7, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(box(1.2, 1.6, 1.4, 0.15), M.yellow, [0, 1.0, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(box(1.2, 0.7, 1.4, 0.15), M.pink, [1.25, 0.55, 0], [0, 0, 0], [1, 1, 1], g);
  const cup = [[0, 0], [0.32, 0], [0.32, 0.08], [0.1, 0.12], [0.08, 0.45], [0.36, 0.6], [0.46, 1.05], [0.42, 1.08], [0.0, 1.0]].map(([x, y]) => new THREE.Vector2(x, y));
  mesh(new THREE.LatheGeometry(cup, 48), M.gold, [0, 1.8, 0], [0, 0, 0], [1, 1, 1], g);
  for (const s of [-1, 1]) mesh(new THREE.TorusGeometry(0.18, 0.05, 12, 32, Math.PI), M.gold, [s * 0.46, 2.55, 0], [0, 0, s * -Math.PI / 2], [1, 1, 1], g);
  anchor('league', 8.6, 3.5, 0.6);
}
// Med-bay: a rounded module with a big mint cross on the roof.
{
  const g = group(-7.4, 3.6, 0.1); pad(g, 4.0, 3.2);
  mesh(box(3.4, 1.8, 2.6, 0.6), M.white, [0, 1.1, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(box(3.44, 0.22, 2.64, 0.1), M.mint, [0, 0.45, 0], [0, 0, 0], [1, 1, 1], g);
  windows(g, 2, 1.25, 1.32, 0.6);
  mesh(box(0.5, 1.5, 0.4, 0.12), M.mint, [0, 2.6, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(box(1.5, 0.5, 0.4, 0.12), M.mint, [0, 2.6, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(cyl(0.05, 0.05, 0.6, 12), M.panel, [0, 2.05, 0], [0, 0, 0], [1, 1, 1], g);
  anchor('medbay', -7.4, 3.6, 3.6);
}
// Hydration: a glass water tank.
{
  const g = group(1.6, 5.0); pad(g, 2.6, 2.6);
  mesh(cyl(0.95, 0.95, 0.3, 48), M.white, [0, 0.35, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(cyl(0.85, 0.85, 1.4, 48), M.water, [0, 1.15, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(cyl(0.9, 0.9, 2.1, 48, 1, true), M.glass, [0, 1.5, 0], [0, 0, 0], [1, 1, 1], g);
  for (const y of [0.6, 1.5, 2.45]) mesh(new THREE.TorusGeometry(0.92, 0.06, 12, 48), M.white, [0, y, 0], [Math.PI / 2, 0, 0], [1, 1, 1], g);
  mesh(sph(0.92, 48, 16).rotateX(0), M.white, [0, 2.55, 0], [0, 0, 0], [1, 0.25, 1], g);
  anchor('water', 1.6, 3.0, 5.0);
}
// Food: a greenhouse dome full of plants.
{
  const g = group(6.2, 4.6); pad(g, 3.2, 3.2);
  mesh(cyl(1.4, 1.45, 0.4, 64), M.white, [0, 0.4, 0], [0, 0, 0], [1, 1, 1], g);
  for (const [x, z, r, m] of [[-0.5, -0.2, 0.42, M.green], [0.4, 0.3, 0.36, M.mint], [0.1, -0.6, 0.3, M.green], [-0.2, 0.55, 0.28, M.yellow], [0.65, -0.35, 0.22, M.red]]) mesh(sph(r), m, [x, 0.75 + r * 0.6, z], [0, 0, 0], [1, 1, 1], g);
  mesh(new THREE.SphereGeometry(1.35, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), M.glass, [0, 0.6, 0], [0, 0, 0], [1, 1.05, 1], g);
  anchor('food', 6.2, 2.4, 4.6);
}
// Solar panels for energy.
{
  const g = group(-8.6, 5.2, 0.25);
  for (let i = 0; i < 3; i++) {
    mesh(cyl(0.06, 0.06, 0.6, 10), M.panel, [i * 1.25 - 1.25, 0.3, 0], [0, 0, 0], [1, 1, 1], g);
    mesh(box(1.1, 0.06, 1.5, 0.03), M.dark, [i * 1.25 - 1.25, 0.65, 0], [-0.45, 0, 0], [1, 1, 1], g);
    mesh(box(1.16, 0.03, 1.56, 0.02), M.white, [i * 1.25 - 1.25, 0.62, 0], [-0.45, 0, 0], [1, 1, 1], g);
  }
}

// ---------- Crystals and alien plants around the edges ----------
const crystal = (x, z, h, m, tilt = 0) => mesh(new THREE.OctahedronGeometry(0.5, 0), m, [x, h * 0.42, z], [tilt, x, tilt * 0.6], [0.55, h, 0.55]);
for (const [x, z, h, m, t] of [[-11.2, -2.0, 1.6, M.violet, 0.15], [-11.6, -0.9, 1.0, M.teal, -0.2], [-10.6, -3.0, 0.9, M.violet, 0.3], [11.4, 2.4, 1.8, M.teal, -0.15], [11.0, 3.6, 1.1, M.violet, 0.25], [-0.4, -6.4, 1.2, M.teal, 0.1], [9.6, -5.4, 1.3, M.violet, -0.25]]) crystal(x, z, h, m, t);
const plant = (x, z, h, head, r) => {
  mesh(cyl(0.07, 0.1, h, 12), M.green, [x, h / 2, z]);
  mesh(sph(r), head, [x, h + r * 0.6, z], [0, 0, 0], [1, 0.85, 1]);
  mesh(sph(r * 0.45), M.yellow, [x, h + r * 1.2, z], [0, 0, 0], [1, 1, 1]);
};
for (const [x, z, h, m, r] of [[-11.0, 2.6, 1.1, M.pink, 0.45], [-10.4, 3.6, 0.7, M.sky, 0.32], [10.6, -1.6, 1.3, M.pink, 0.5], [11.3, -0.6, 0.8, M.teal, 0.34], [3.6, 6.4, 0.7, M.pink, 0.32], [-5.0, -6.3, 0.9, M.sky, 0.36], [8.6, 6.2, 0.9, M.yellow, 0.36]]) plant(x, z, h, m, r);
for (const [x, z, r, m] of [[-9.0, 0.8, 0.45, M.top], [3.4, 1.6, 0.3, M.crater], [-4.9, -1.1, 0.35, M.crater], [10.2, 1.0, 0.4, M.crater]]) mesh(sph(r, 24, 16), m, [x, r * 0.4, z], [0, 0, 0], [1, 0.6, 1]);

// ---------- Sky decorations: ringed planet and moon, placed by screen position ----------
camera.updateMatrixWorld();
const atScreen = (x, y) => new THREE.Vector3(x, y, -0.3).unproject(camera);
const planet = new THREE.Group(); planet.position.copy(atScreen(-0.77, 0.66)); scene.add(planet);
const pm = mesh(sph(2.3, 64, 48), mat(0xffa978, { roughness: 0.7 }), [0, 0, 0], [0, 0, 0], [1, 1, 1], planet); pm.castShadow = false;
const ring = mesh(new THREE.TorusGeometry(3.5, 0.22, 16, 128), mat(0x5fe3c8, { roughness: 0.5 }), [0, 0, 0], [1.2, 0.3, 0.35], [1, 1, 0.3], planet); ring.castShadow = false;
const moon = mesh(sph(0.95, 48, 32), mat(0xfff2c4, { roughness: 0.8 }), atScreen(0.83, 0.72).toArray()); moon.castShadow = false;
for (const [x, y, r] of [[0.62, 0.86, 0.22], [-0.45, 0.88, 0.16], [0.95, 0.35, 0.18]]) { const m = mesh(sph(r, 24, 16), mat(0xffffff, { emissive: 0xffffff, emissiveIntensity: 0.6 }), atScreen(x, y).toArray()); m.castShadow = false; }

// A little med-rocket parked on the front-left of the island.
{
  const g = group(-2.3, 7.0, 0.4); pad(g, 2.4, 2.4);
  mesh(cyl(0.55, 0.62, 2.2, 48), M.white, [0, 1.5, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(new THREE.ConeGeometry(0.55, 1.0, 48), M.pink, [0, 3.1, 0], [0, 0, 0], [1, 1, 1], g);
  mesh(cyl(0.26, 0.26, 0.08, 32), M.dark, [0, 2.0, 0.56], [Math.PI / 2, 0, 0], [1, 1, 1], g);
  mesh(new THREE.TorusGeometry(0.27, 0.05, 12, 32), M.white, [0, 2.0, 0.6], [0, 0, 0], [1, 1, 1], g);
  mesh(box(0.14, 0.44, 0.06, 0.03), M.mint, [0, 1.25, 0.6], [0, 0, 0], [1, 1, 1], g);
  mesh(box(0.44, 0.14, 0.06, 0.03), M.mint, [0, 1.25, 0.6], [0, 0, 0], [1, 1, 1], g);
  for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2 + 0.5; mesh(box(0.12, 0.8, 0.6, 0.05), M.sky, [Math.cos(a) * 0.6, 0.65, Math.sin(a) * 0.6], [0, -a, 0], [1, 1, 1], g); }
  mesh(cyl(0.38, 0.3, 0.3, 32), M.panel, [0, 0.3, 0], [0, 0, 0], [1, 1, 1], g);
  anchor('rocket', -2.3, 3.9, 7.0);
}
for (const [x, z, h, m, t] of [[-11.0, 4.6, 1.2, M.teal, 0.2], [4.8, 6.6, 0.9, M.violet, -0.2], [-4.6, 6.8, 0.8, M.teal, 0.25]]) crystal(x, z, h, m, t);
for (const [x, z, h, m, r] of [[-11.2, 6.2, 0.8, M.yellow, 0.34], [-0.2, 3.0, 0.5, M.pink, 0.24], [9.8, 4.6, 0.6, M.sky, 0.28]]) plant(x, z, h, m, r);

renderer.render(scene, camera);

// Report each station's label anchor in percent of the frame.
camera.updateMatrixWorld();
window.__anchors = Object.fromEntries(Object.entries(anchors).map(([k, v]) => {
  const p = v.clone().project(camera);
  return [k, { x: +((p.x + 1) / 2 * 100).toFixed(1), y: +((1 - p.y) / 2 * 100).toFixed(1) }];
}));
window.__done = true;
</script>
