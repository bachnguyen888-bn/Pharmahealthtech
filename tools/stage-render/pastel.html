<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Pastel iridescent studio render: fluid glossy forms in soft light, calm centre for the browser window.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const P = new URLSearchParams(location.search);
const W = Number(P.get('w') || 1920), H = Number(P.get('h') || 1080);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = Number(P.get('env') ?? 1.0);

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
camera.position.set(0, 0, 20);

// Backdrop: pastel sky-blue to blush-pink wash, brightest in the middle.
const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 24),
  new THREE.ShaderMaterial({
    toneMapped: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `
      varying vec2 vUv;
      vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
      float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){
        vec3 blue = lin(vec3(0.58, 0.77, 1.00));   // #94C4FF
        vec3 pink = lin(vec3(1.00, 0.70, 0.85));   // #FFB3D9
        vec3 lilac = lin(vec3(0.80, 0.74, 1.00));  // #CCBDFF
        vec3 mist = lin(vec3(0.95, 0.93, 1.00));   // #F2EDFF
        float t = smoothstep(0.05, 0.95, vUv.x * 0.62 + (1.0 - vUv.y) * 0.38);
        vec3 col = mix(blue, pink, t);
        col = mix(col, lilac, 0.35 * smoothstep(0.2, 0.0, abs(t - 0.5) - 0.12));
        float d = length((vUv - vec2(0.5, 0.52)) * vec2(1.5, 1.0));
        col = mix(mist, col, smoothstep(0.04, 0.5, d));
        col += (h(gl_FragCoord.xy) - 0.5) / 255.0;   // dither against banding
        gl_FragColor = vec4(col, 1.0);
      }`,
  })
);
backdrop.position.z = -7;
scene.add(backdrop);

scene.add(new THREE.HemisphereLight(0xdcebff, 0xffd6ea, 0.38));
const key = new THREE.DirectionalLight(0xffffff, 2.8);
key.position.set(-6, 8, 12);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffd1ea, 1.4);
rim.position.set(9, -4, -4);
scene.add(rim);
const rim2 = new THREE.DirectionalLight(0xc9e2ff, 1.2);
rim2.position.set(-9, -3, -3);
scene.add(rim2);

// Pearly iridescent material in a pastel tint.
const pearl = (hex, extra = {}) => new THREE.MeshPhysicalMaterial({
  color: hex, roughness: 0.1, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.04,
  iridescence: 1, iridescenceIOR: 1.45, iridescenceThicknessRange: [120, 820],
  sheen: 0.6, sheenColor: new THREE.Color(0xffe0f4), sheenRoughness: 0.4, ...extra,
});
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.03, metalness: 0, transmission: 1, thickness: 1.2, ior: 1.4,
  iridescence: 0.9, iridescenceIOR: 1.3, iridescenceThicknessRange: [200, 500],
  attenuationColor: new THREE.Color(0xd9e8ff), attenuationDistance: 4, clearcoat: 1, clearcoatRoughness: 0.02,
});

// Flowing ribbon: a smooth tube sweeping around the edges of the frame, behind where the window sits.
const flow = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-11.5, -1.8, -2.4),
  new THREE.Vector3(-8.2, 1.6, -1.0),
  new THREE.Vector3(-6.6, 4.7, 0.2),
  new THREE.Vector3(-2.2, 5.6, -1.4),
  new THREE.Vector3(2.6, 5.2, -2.6),
  new THREE.Vector3(6.4, 5.3, -0.6),
  new THREE.Vector3(8.0, 2.4, 0.6),
  new THREE.Vector3(7.4, -1.6, -0.8),
  new THREE.Vector3(8.6, -4.6, 0.4),
  new THREE.Vector3(12.0, -5.8, -1.6),
], false, 'catmullrom', 0.5);
const tube = new THREE.Mesh(new THREE.TubeGeometry(flow, 420, 0.62, 64, false), pearl(0xd3c2ff));
scene.add(tube);

// A second, thinner ribbon low on the left for rhythm.
const flow2 = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-12.0, -6.4, -1.8),
  new THREE.Vector3(-8.4, -4.6, 0.2),
  new THREE.Vector3(-4.6, -5.4, -0.6),
  new THREE.Vector3(-1.0, -6.6, -2.2),
]);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(flow2, 200, 0.34, 48, false), pearl(0xffb9dc)));

// Soft droplet: a sphere with a gentle, smooth wobble.
const droplet = (r, seed) => {
  const g = new THREE.SphereGeometry(r, 160, 120);
  const pos = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const k = 1 + 0.06 * Math.sin(v.x * 2.1 + seed) * Math.cos(v.y * 1.7 + seed * 0.7) + 0.04 * Math.sin(v.z * 2.6 + seed * 1.3);
    pos.setXYZ(i, v.x * r * k, v.y * r * k, v.z * r * k);
  }
  g.computeVertexNormals();
  return g;
};
const add = (geo, mat, p, r = [0, 0, 0]) => { const m = new THREE.Mesh(geo, mat); m.position.set(...p); m.rotation.set(...r); scene.add(m); return m; };
add(droplet(1.55, 1.2), pearl(0x9fcaff), [-7.4, -3.2, 1.0]);          // blue droplet, lower left
add(droplet(1.15, 2.7), pearl(0xffa9d2), [7.6, 3.4, 1.4]);            // pink droplet, upper right
add(new THREE.SphereGeometry(0.62, 96, 64), glass, [-4.2, 5.0, 1.6]); // glass bead, top
add(new THREE.SphereGeometry(0.42, 96, 64), pearl(0xffffff), [5.0, -5.0, 1.2]);
add(new THREE.TorusGeometry(0.95, 0.32, 96, 192), pearl(0xb7d7ff), [-8.6, 2.8, -0.4], [0.9, 0.5, 0.3]); // ring, left
add(new THREE.SphereGeometry(0.3, 64, 48), glass, [9.6, -1.6, 1.8]);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), Number(P.get('bloom') ?? 0.12), 0.25, 1.0));
composer.addPass(new OutputPass());
renderer.render(scene, camera);
composer.render();
window.__done = true;
</script>
</body>
</html>
