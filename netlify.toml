# Netlify settings. The website is the site/ folder. The index.html at the repo root is the
# offline checker, which is not part of the website, so it must never be the publish folder.
[build]
  publish = "site"

# Pengu is the homepage. This rule comes first so "/" is always served the Pengu page.
[[redirects]]
  from = "/"
  to = "/clearhealth-pengu.html"
  status = 200
  force = true

# /index.html used to be the paused pharmacy refund page, which has been removed from the site.
# Old links to it go to the homepage.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
